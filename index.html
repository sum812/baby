<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="./public/baby.jpg" />
    <title>Yêu Bé ❤❤❤</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(
          135deg,
          #ff6b9d 0%,
          #c06c84 50%,
          #6c5b7b 100%
        );
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        text-align: center;
        max-width: 800px;
        width: 100%;
      }

      h1 {
        color: #ff6b9d;
        font-size: 2.5em;
        margin-bottom: 20px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
      }

      #title {
        font-size: 1.5em;
        color: #c06c84;
        margin-bottom: 20px;
        min-height: 40px;
        font-weight: bold;
      }

      #play-btn {
        background: linear-gradient(135deg, #ff6b9d 0%, #c06c84 100%);
        color: white;
        border: none;
        padding: 15px 40px;
        font-size: 1.3em;
        border-radius: 50px;
        cursor: pointer;
        font-weight: bold;
        transition: all 0.3s;
        margin-bottom: 30px;
        box-shadow: 0 5px 15px rgba(255, 107, 157, 0.4);
      }

      #play-btn:hover:not(:disabled) {
        transform: translateY(-3px);
        box-shadow: 0 8px 25px rgba(255, 107, 157, 0.6);
      }

      #play-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .canvas-container {
        display: flex;
        gap: 20px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .canvas-box {
        flex: 1;
        min-width: 300px;
      }

      .canvas-box h3 {
        color: #6c5b7b;
        margin-bottom: 10px;
        font-size: 1.2em;
      }

      canvas {
        border: 3px solid #ff6b9d;
        border-radius: 15px;
        max-width: 100%;
        height: auto;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        background: white;
      }

      .progress-container {
        margin: 20px 0;
      }

      .progress-bar {
        width: 100%;
        height: 30px;
        background: #f0f0f0;
        border-radius: 15px;
        overflow: hidden;
        position: relative;
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #ff6b9d 0%, #c06c84 100%);
        width: 0%;
        transition: width 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: bold;
      }

      .hearts {
        font-size: 2em;
        margin: 20px 0;
        animation: pulse 1s infinite;
      }

      .d-none {
        display: none;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.1);
        }
      }

      .file-upload {
        display: flex;
        gap: 15px;
        justify-content: center;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }

      .upload-btn {
        position: relative;
        overflow: hidden;
        background: #6c5b7b;
        color: white;
        padding: 10px 20px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: bold;
        transition: all 0.3s;
      }

      .upload-btn:hover {
        background: #5a4a6a;
        transform: translateY(-2px);
      }

      .upload-btn input {
        position: absolute;
        left: 0;
        top: 0;
        opacity: 0;
        cursor: pointer;
        width: 100%;
        height: 100%;
      }

      .file-info {
        font-size: 0.9em;
        color: #28a745;
        margin-top: 5px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Chúc em 20/10 Vui Vẻ ❤️</h1>

      <div class="file-upload">
        <div>
          <label class="upload-btn">
            📷 Chọn Ảnh
            <input type="file" id="image-input" accept="image/*" />
          </label>
          <div id="image-info" class="file-info"></div>
        </div>
        <div>
          <label class="upload-btn">
            🎵 Chọn Nhạc
            <input type="file" id="audio-input" accept="audio/*" />
          </label>
          <div id="audio-info" class="file-info"></div>
        </div>
      </div>

      <div id="title">Chọn ảnh và nhạc ❤️ Không cần chọn cũng được nha!</div>

      <button id="play-btn">▶️ Bấm đêêêêêêêêê</button>

      <div class="progress-container">
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill">0%</div>
        </div>
      </div>

      <div class="canvas-container">
        <div class="canvas-box">
          <h3>(´▽`ʃ♡ƪ)</h3>
          <canvas id="canvas"></canvas>
        </div>
        <div class="d-none">
          <h3>📷 Baby</h3>
          <canvas id="original-canvas"></canvas>
        </div>
      </div>

      <div class="hearts">❤️ 💕 💖 💗 💓</div>
    </div>

    <script>
      const canvas = document.getElementById("canvas");
      const originalCanvas = document.getElementById("original-canvas");
      const ctx = canvas.getContext("2d");
      const originalCtx = originalCanvas.getContext("2d");
      const title = document.getElementById("title");
      const playBtn = document.getElementById("play-btn");
      const progressFill = document.getElementById("progress-fill");
      const imageInput = document.getElementById("image-input");
      const audioInput = document.getElementById("audio-input");
      const imageInfo = document.getElementById("image-info");
      const audioInfo = document.getElementById("audio-info");

      let audio = null;
      let img = null;
      let imageData = null;
      let points = [];
      let currentIndex = 0;
      let animationId = null;

      imageInput.addEventListener("change", function (e) {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function (event) {
            img = new Image();
            img.onload = function () {
              displayOriginalImage();
              imageInfo.textContent = "✓ Đã chọn: " + file.name;
            };
            img.src = event.target.result;
          };
          reader.readAsDataURL(file);
        }
      });

      audioInput.addEventListener("change", function (e) {
        const file = e.target.files[0];
        if (file) {
          const url = URL.createObjectURL(file);
          audio = new Audio(url);
          audio.loop = true;
          audioInfo.textContent = "✓ Đã chọn: " + file.name;
        }
      });

      function displayOriginalImage() {
        const maxSize = 400;
        const ratio = Math.min(maxSize / img.width, maxSize / img.height, 1);
        const w = Math.floor(img.width * ratio);
        const h = Math.floor(img.height * ratio);

        originalCanvas.width = w;
        originalCanvas.height = h;
        originalCtx.drawImage(img, 0, 0, w, h);

        canvas.width = w;
        canvas.height = h;
      }

      function prepareDrawing() {
        const w = originalCanvas.width;
        const h = originalCanvas.height;

        imageData = originalCtx.getImageData(0, 0, w, h);

        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, w, h);

        points = [];
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const index = (y * w + x) * 4;
            const r = imageData.data[index];
            const g = imageData.data[index + 1];
            const b = imageData.data[index + 2];
            points.push({ x, y, r, g, b });
          }
        }

        currentIndex = 0;
      }

      function drawFrame() {
        const speed = 20;

        for (let i = 0; i < speed && currentIndex < points.length; i++) {
          const point = points[currentIndex];
          ctx.fillStyle = `rgb(${point.r}, ${point.g}, ${point.b})`;
          ctx.fillRect(point.x, point.y, 1, 1);
          currentIndex++;
        }

        const progress = Math.min(
          100,
          Math.floor((currentIndex / points.length) * 100)
        );
        progressFill.style.width = progress + "%";
        progressFill.textContent = progress + "%";
        title.textContent = `Yêu Em ❤️ - Đã vẽ ${progress}%`;

        if (currentIndex < points.length) {
          animationId = requestAnimationFrame(drawFrame);
        } else {
          title.textContent = "Chúc Em 20/10 Vui Vẻ ❤️";
          title.style.color = "green";
          playBtn.disabled = false;
          playBtn.textContent = "🔄 Vẽ Lại";
        }
      }

      async function startDrawing() {
        if (!img) {
          alert("⚠️ Vui lòng chọn ảnh trước!");
          return;
        }

        playBtn.disabled = true;
        title.textContent = "Đang vẽ cho Em ❤️";
        title.style.color = "#c06c84";

        if (audio) {
          try {
            await audio.play();
          } catch (err) {
            console.log("Autoplay bị chặn:", err);
          }
        }

        prepareDrawing();
        drawFrame();
      }

      playBtn.addEventListener("click", startDrawing);

      window.addEventListener("load", function () {
        const defaultImg = new Image();
        defaultImg.onload = function () {
          img = defaultImg;
          displayOriginalImage();
          imageInfo.textContent = "✓ Ảnh mặc định: baby.jpg";
        };
        defaultImg.onerror = function () {
          console.log("Không có ảnh mặc định");
        };
        defaultImg.src = "./public/baby.jpg";

        const defaultAudio = new Audio("./public/music.mp3");
        defaultAudio.addEventListener("canplaythrough", function () {
          audio = defaultAudio;
          audio.loop = true;
          audioInfo.textContent = "✓ Nhạc mặc định: music.mp3";
        });
        defaultAudio.addEventListener("error", function () {
          console.log("Không có nhạc mặc định");
        });
      });
    </script>
  </body>
</html>
